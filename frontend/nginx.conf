server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # --- Compression ---
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml
        font/woff2;

    # --- Security headers ---
    # NOTE: nginx add_header does not inherit into location blocks that define
    # their own add_header directives. Headers are repeated explicitly below.
    add_header X-Frame-Options         "SAMEORIGIN"                       always;
    add_header X-Content-Type-Options  "nosniff"                          always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin"  always;
    add_header Permissions-Policy      "camera=(), microphone=(), geolocation=()" always;

    # --- Redirect bare path to trailing-slash version ---
    location = /ruthless-execution {
        return 301 /ruthless-execution/;
    }

    # --- Vite content-hashed assets: cache for 1 year ---
    # Vite appends a content hash to every JS/CSS/font filename (e.g. index.a3f9bc.js).
    # A new deploy produces new filenames, so immutable 1-year caching is safe.
    location ~* ^/ruthless-execution/assets/ {
        rewrite ^/ruthless-execution/(.*)$ /$1 break;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Frame-Options        "SAMEORIGIN"                       always;
        add_header X-Content-Type-Options "nosniff"                          always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin"  always;
        add_header Permissions-Policy     "camera=(), microphone=(), geolocation=()" always;
    }

    # --- Static files (favicon, robots.txt, etc.): short cache ---
    location ~* ^/ruthless-execution/.*\.(ico|png|jpg|jpeg|gif|webp|svg|txt)$ {
        rewrite ^/ruthless-execution/(.*)$ /$1 break;
        expires 1d;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Frame-Options        "SAMEORIGIN"                       always;
        add_header X-Content-Type-Options "nosniff"                          always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin"  always;
        add_header Permissions-Policy     "camera=(), microphone=(), geolocation=()" always;
    }

    # --- SPA routes: never cache HTML ---
    # index.html references hashed asset URLs — it must always be fresh so
    # browsers load the correct JS/CSS after every deploy.
    location /ruthless-execution/ {
        alias /usr/share/nginx/html/;
        # Named fallback fixes the try_files + alias bug: a bare /index.html
        # last-arg would redirect to a URI that matches no location → 404.
        try_files $uri $uri/ @spa;
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma         "no-cache"                           always;
        add_header X-Frame-Options        "SAMEORIGIN"                       always;
        add_header X-Content-Type-Options "nosniff"                          always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin"  always;
        add_header Permissions-Policy     "camera=(), microphone=(), geolocation=()" always;
    }

    # --- SPA fallback: serve index.html for all unknown routes ---
    location @spa {
        root /usr/share/nginx/html;
        try_files /index.html =404;
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma         "no-cache"                           always;
        add_header X-Frame-Options        "SAMEORIGIN"                       always;
        add_header X-Content-Type-Options "nosniff"                          always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin"  always;
        add_header Permissions-Policy     "camera=(), microphone=(), geolocation=()" always;
    }
}
