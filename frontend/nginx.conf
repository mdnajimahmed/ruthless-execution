server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Redirect bare /ruthless-execution to trailing-slash version
    location = /ruthless-execution {
        return 301 /ruthless-execution/;
    }

    # Serve the SPA under /ruthless-execution/
    # alias strips the location prefix so files resolve to /usr/share/nginx/html/
    location /ruthless-execution/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /index.html;
    }
}
