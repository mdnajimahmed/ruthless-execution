name: Build & Push Docker Images

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          APP_NAME=$(jq -r '.appName' version.json)
          VERSION=$(jq -r '.version' version.json)
          echo "app_name=$APP_NAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ivplay4689/turinghatch:${{ steps.version.outputs.app_name }}-be-${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          # VITE_API_URL is baked in at build time by Vite — set this secret in GitHub repo settings
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
          tags: ivplay4689/turinghatch:${{ steps.version.outputs.app_name }}-fe-${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
