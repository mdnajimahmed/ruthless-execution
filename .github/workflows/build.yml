name: Build & Push Docker Images

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: production
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from package.json
        id: version
        run: |
          echo "app_name=$(jq -r '.name' package.json)" >> $GITHUB_OUTPUT
          echo "version=$(jq -r '.version' package.json)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Platforms:
      #   linux/amd64 — Ubuntu CI runner (native), macOS Intel, Windows, Linux x86
      #   linux/arm64 — Oracle Cloud Ampere free tier, macOS Apple Silicon, ARM servers
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ivplay4689/turinghatch:${{ steps.version.outputs.app_name }}-be-${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          # VITE_API_URL is baked into the JS bundle at build time by Vite.
          # Set this secret in GitHub repo Settings → Secrets → Actions.
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
          tags: ivplay4689/turinghatch:${{ steps.version.outputs.app_name }}-fe-${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
