name: Mobile — Android Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Extra release notes (optional)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-android:
    name: Android APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: npm ci --legacy-peer-deps

      - name: Read version
        id: version
        run: |
          VERSION=$(node -e "console.log(require('./mobile/app.json').expo.version)")
          BUILD=${{ github.run_number }}
          echo "version=$VERSION"  >> $GITHUB_OUTPUT
          echo "build=$BUILD"      >> $GITHUB_OUTPUT
          echo "tag=mobile-v${VERSION}-build.${BUILD}" >> $GITHUB_OUTPUT
          echo "apk_name=ruthless-execution-v${VERSION}-build${BUILD}.apk" >> $GITHUB_OUTPUT

      - uses: android-actions/setup-android@v3

      - name: Install NDK + build tools
        run: sdkmanager --install "ndk;26.1.10909125" "build-tools;34.0.0" "platforms;android-35"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('mobile/package-lock.json') }}
          restore-keys: gradle-

      - name: Write .env
        run: echo "EXPO_PUBLIC_API_URL=https://turinghatch.com/ruthless-execution/api" > mobile/.env

      - name: Prebuild Android
        working-directory: mobile
        run: expo prebuild --platform android --no-install --clean
        env:
          EXPO_PUBLIC_API_URL: https://turinghatch.com/ruthless-execution/api

      - name: Stamp versionCode + versionName
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ steps.version.outputs.build }}/" mobile/android/app/build.gradle
          sed -i 's/versionName "[^"]*"/versionName "${{ steps.version.outputs.version }}"/' mobile/android/app/build.gradle

      - name: Build APK
        working-directory: mobile/android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
        env:
          EXPO_PUBLIC_API_URL: https://turinghatch.com/ruthless-execution/api

      - name: Rename APK
        run: |
          cp mobile/android/app/build/outputs/apk/release/app-release.apk \
             ${{ steps.version.outputs.apk_name }}

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ${{ steps.version.outputs.apk_name }}
          retention-days: 7

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Ruthless Execution v${{ steps.version.outputs.version }} (build ${{ steps.version.outputs.build }})"
          body: |
            ## Ruthless Execution — Android Release

            | | |
            |---|---|
            | **Version** | `${{ steps.version.outputs.version }}` |
            | **Build**   | `#${{ steps.version.outputs.build }}` |
            | **API**     | `https://turinghatch.com/ruthless-execution/api` |
            | **Commit**  | `${{ github.sha }}` |

            ### Install
            1. Download **`${{ steps.version.outputs.apk_name }}`**
            2. Settings → Apps → Install unknown apps → enable for your browser
            3. Open the APK → Install

            ${{ github.event.inputs.release_notes }}
          files: ${{ steps.version.outputs.apk_name }}
          draft: false
          prerelease: false
